{{- if .Values.jobs.dbMigrate.enabled }}
# Stack specification 8.5: the migration runs as a Helm hook, so it finishes before `web`
# starts. It applies `infra/postgres/` and the drizzle-kit migrations in order.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: db-migrate
    {{- include "awp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.jobs.dbMigrate.backoffLimit }}
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-migrate }
    spec:
      restartPolicy: Never
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "awp.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/web/db-migrate/db/migrate.js"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # The compiled entry point does not sit where the source does, so the SQL it runs
          # is named rather than walked up to from the file.
          env:
            - { name: AWP_MIGRATIONS_DIR, value: /repo/apps/web/db-migrate/migrations }
            - { name: AWP_POSTGRES_SQL_DIR, value: /repo/infra/postgres }
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          resources: {{- toYaml .Values.jobs.dbMigrate.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
