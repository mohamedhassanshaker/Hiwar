apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-service
    {{- include "awp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentService.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agent-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        {{- include "awp.labels" . | nindent 8 }}
    spec:
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Stack specification 8.5: the service waits for what it cannot work without.
      initContainers:
        - name: wait-for-temporal
          image: {{ include "awp.image" (list . "agent") }}
          command: ["python", "-m", "awp_agent.wait_for", "{{ .Values.config.temporalAddress }}"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # The namespace's ResourceQuota requires a request on every container, init
          # containers included.
          resources: {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
        - name: wait-for-agentgateway
          image: {{ include "awp.image" (list . "agent") }}
          command: ["python", "-m", "awp_agent.wait_for", "{{ .Values.config.agwLlmUrl }}/v1/models"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: agent-service
          image: {{ include "awp.image" (list . "agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "awp_agent.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.agentService.port }}"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.agentService.port }} }]
          env:
            # graphiti-core sends usage telemetry to PostHog by default; egress refuses it (D255).
            - { name: GRAPHITI_TELEMETRY_ENABLED, value: "false" }
            {{- include "awp.env" . | nindent 12 }}
          envFrom:
            {{- include "awp.envFrom" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.agentService.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-service
    {{- include "awp.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: agent-service }
  ports: [{ name: http, port: {{ .Values.agentService.port }}, targetPort: http }]
