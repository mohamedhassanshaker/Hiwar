# Stack specification 4.1 and 6.1: the console renders agentgateway's LLM, MCP and A2A
# routes from Models & routes, Connectors and Integrations, and applies them through this
# service account, along with the Secret each provider connection's credential lives in
# (`src/agentgateway/secrets.ts`). Its Role reaches exactly those resources in the AI
# namespace and nothing else — no Pod, no other namespace, no other Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-agentgateway
  namespace: {{ .Values.aiNamespace }}
rules:
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaymodels, agentgatewaybackends, agentgatewaypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-agentgateway
  namespace: {{ .Values.aiNamespace }}
subjects:
  - { kind: ServiceAccount, name: web, namespace: {{ .Values.namespace }} }
roleRef: { kind: Role, name: web-agentgateway, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "awp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "awp.labels" . | nindent 8 }}
    spec:
      serviceAccountName: web
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "awp.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.web.port }} }]
          env:
            {{- include "awp.env" . | nindent 12 }}
          envFrom:
            {{- include "awp.envFrom" . | nindent 12 }}
          # Acceptance 19: readiness is the health endpoint the System screen aggregates. It
          # answers within about 2 s whatever its dependencies do (`lib/health.ts` bounds each
          # check at 2 s, in parallel), so the timeout sits above that: at the default 1 s a slow
          # dependency took a healthy pod out of service and then restarted it (D200).
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # The image's WORKDIR is /repo and Next.js writes its cache beside the server.
            - { name: cache, mountPath: /repo/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "awp.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: {{ .Values.web.port }}, targetPort: http }]
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
