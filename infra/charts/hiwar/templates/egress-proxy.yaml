# Stack specification 8.6: the only way out of the sandbox namespace, with an allow-list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy
  namespace: {{ .Values.namespace }}
data:
  # Everything squid would otherwise write under /var is sent to stdout or to the writable
  # mounts below, so the container satisfies the namespace's restricted Pod Security
  # Standard with a read-only root filesystem.
  squid.conf: |
    http_port {{ .Values.egressProxy.port }}
    # containerd hands the container a file-descriptor limit in the millions, and squid
    # sizes its tables from it: without this it is killed before it finishes starting.
    max_filedescriptors 1024
    cache_mem 8 MB
    {{- if .Values.egressProxy.allowAll }}
    # D297: a developer machine lets any destination through, a host name or an address.
    http_access allow all
    {{- else }}
    acl allowed_domains dstdomain {{ join " " .Values.egressProxy.allowedDomains }}
    http_access allow allowed_domains
    http_access deny all
    {{- end }}
    access_log stdio:/dev/stdout
    cache_log stdio:/dev/stdout
    cache deny all
    cache_store_log none
    pid_filename none
    coredump_dir /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: egress-proxy
    {{- include "hiwar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egressProxy.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: egress-proxy }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-proxy
        {{- include "hiwar.labels" . | nindent 8 }}
    spec:
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: squid
          image: {{ include "hiwar.image" (list . "egressProxy") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # -N keeps squid in the foreground; the image's own entrypoint expects to be root.
          command: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: proxy, containerPort: {{ .Values.egressProxy.port }} }]
          readinessProbe:
            tcpSocket: { port: proxy }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.egressProxy.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/squid/squid.conf, subPath: squid.conf }
            - { name: cache, mountPath: /var/spool/squid }
            - { name: run, mountPath: /var/run/squid }
            - { name: logs, mountPath: /var/log/squid }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: egress-proxy } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: egress-proxy
    {{- include "hiwar.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: egress-proxy }
  ports: [{ name: proxy, port: {{ .Values.egressProxy.port }}, targetPort: proxy }]
