instances: 1
storage: 5Gi
pooler: false
# Creates the `<cluster>-superuser` Secret, which only the migration uses.
superuserAccess: false
databases: []
# Extensions created with a database, keyed by database name.
extensions: {}
# The PostgreSQL image is pinned by tag here and by digest in versions.lock.md.
imageName: ghcr.io/cloudnative-pg/postgresql:18.6
