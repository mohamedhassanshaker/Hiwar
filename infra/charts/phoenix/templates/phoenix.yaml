apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: phoenix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phoenix
  ports:
    # The UI and the OTLP/HTTP collector share this port; OTLP/gRPC has its own.
    - { name: http, port: 6006, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: phoenix
spec:
  replicas: 1
  # Phoenix owns a single volume, so the old pod goes before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phoenix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phoenix
    spec:
      securityContext:
        runAsNonRoot: true
        # The nonroot image ships as UID 65532 and owns its virtual environment.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: phoenix
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: 6006 }
            - { name: otlp-grpc, containerPort: 4317 }
          env:
            - name: PHOENIX_SQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: PHOENIX_SQL_DATABASE_URL
            # Off deliberately. Phoenix's authentication guards its UI and its OTLP
            # ingestion with the same check, and the only credential it accepts is a system
            # API key created inside Phoenix itself — `PHOENIX_API_KEY` is a *client*
            # variable its server has no setting for. With auth on and no such key minted,
            # every span this platform produced was answered "401 Invalid token" and
            # dropped, so the platform ran with no traces and nothing said so.
            #
            # The access boundary for this cluster's internal UIs is the gateway, which is
            # also how the Temporal UI beside it is reached. Exposing Phoenix anywhere a
            # gateway does not guard needs a system key minted here first.
            - name: PHOENIX_ENABLE_AUTH
              value: "false"
            - name: PHOENIX_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecret }}
                  key: secret
            # Not /phoenix: the image keeps its virtual environment at /phoenix/.venv and
            # a volume mounted there would hide it, leaving the entry point with no
            # `phoenix` module to import.
            - name: PHOENIX_WORKING_DIR
              value: /data
            - name: PHOENIX_HOST
              value: 0.0.0.0
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            # SD-11. Phoenix runs the sweep itself; the window keeps the database small.
            - name: PHOENIX_TRACE_RETENTION_DAYS
              value: {{ .Values.traceRetentionDays | quote }}
          volumeMounts:
            - { name: working, mountPath: /data }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: working
          persistentVolumeClaim:
            claimName: phoenix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
