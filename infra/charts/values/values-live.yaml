# Live: autoscaled console, three worker replicas per queue, a wider warm pool.
image:
  registry: registry.tahseel.ae/awp
  pullPolicy: IfNotPresent
  pullSecrets: [{ name: registry-tahseel }]

config:
  appUrl: https://awp.tahseel.ae
  webauthnRpId: awp.tahseel.ae
  logLevel: info

web:
  replicas: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 65 }
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

agentService:
  replicas: 3
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

agentWorkers:
  - { name: agent-runs, queue: agent-runs, replicas: 4 }
  - { name: ingestion, queue: ingestion, replicas: 2 }

agentWorkerResources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }

sandboxManager:
  warmPool: 8

egressProxy:
  replicas: 2
  allowedDomains:
    - .tahseel.ae
    - .anthropic.com
    - .openai.com
    - .azure.com
    - .uaepass.ae
