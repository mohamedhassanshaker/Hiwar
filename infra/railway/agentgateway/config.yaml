# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway on Railway (D390): a static configuration, because Railway has no Kubernetes
# API for the console to render Models & routes into. Each route alias is a virtual model
# calling the same OpenRouter model as the kind cluster's route of that alias (console, Models &
# routes), with no fallback to the local engine: its answers are placeholders, not replies. A
# route edited in the console is saved but not live here until this file is changed and the
# image rebuilt (scripts/railway/images.sh).
gateways:
  default:
    port: 8080

llm:
  models:
    - name: nemotron-ultra
      visibility: internal
      provider: openrouter
      params: { model: "nvidia/nemotron-3-ultra-550b-a55b:free", apiKey: "$OPENROUTER_API_KEY" }
    - name: nemotron-super-vl
      visibility: internal
      provider: openrouter
      params: { model: "nvidia/nemotron-3.5-super-vl:free", apiKey: "$OPENROUTER_API_KEY" }
    # The model the kind knowledge base was embedded with, so copied passages stay searchable.
    - name: nemotron-embed
      visibility: internal
      provider: openrouter
      params: { model: "nvidia/nemotron-3-embed-1b:free", apiKey: "$OPENROUTER_API_KEY" }
    # The deterministic local engine (services/modelstub), reached on the private network.
    - name: local-fast
      visibility: internal
      provider: openAI
      params: { model: awp-local-fast, baseUrl: "$MODEL_ENGINE_URL", apiKey: "none" }

  virtualModels:
    - name: reasoning-default
      routing: { failover: { targets: [{ model: nemotron-ultra, priority: 0 }] } }
    - name: local-private
      routing: { failover: { targets: [{ model: nemotron-ultra, priority: 0 }] } }
    - name: small-fast
      routing: { failover: { targets: [{ model: nemotron-ultra, priority: 0 }] } }
    - name: vision
      routing: { failover: { targets: [{ model: nemotron-ultra, priority: 0 }] } }
    - name: classifier-typed
      routing: { failover: { targets: [{ model: nemotron-super-vl, priority: 0 }] } }
    - name: embedding-default
      routing: { failover: { targets: [{ model: nemotron-embed, priority: 0 }] } }
    # A Decision route (D290) answers at OpenRouter's decisions endpoint, which only the
    # console's rendered custom format reaches; here the room's agent choice is the local engine's.
    - name: agent-choice
      routing: { failover: { targets: [{ model: local-fast, priority: 0 }] } }
