# Traefik Proxy as the Gateway API implementation (stack specification 3.1 and 8.6). It is
# the only workload exposed outside the cluster: kind maps the control plane's NodePorts
# 30080 and 30443 to the host's HTTP and HTTPS ports.
#
# The chart owns the `traefik` GatewayClass and the `hiwar` Gateway, because the chart only
# creates the class alongside its own gateway. The certificate the HTTPS listener names is
# issued by cert-manager from `infra/gateway/gateway.yaml`, which is applied later in the
# bootstrap; until then that listener is simply not ready.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    # A middleware referenced from an HTTPRoute filter lives beside its route, in the
    # namespace that owns the route rather than Traefik's.
    allowCrossNamespace: true

gatewayClass:
  enabled: true
  name: traefik

gateway:
  enabled: true
  name: hiwar
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - name: hiwar-wildcard-tls
          kind: Secret

# Chart 41 reads the Service type from service.spec; kind has no load balancer, so a
# LoadBalancer Service never becomes ready and `helm --wait` times out.
service:
  spec:
    type: NodePort

ports:
  web:
    # The Service port is the host port, so `hiwar.localtest.me:8080` means the same thing in
    # the browser and inside the cluster, where CoreDNS answers those names with this
    # Service, so a public URL is one origin everywhere.
    exposedPort: ${HTTP_PORT}
    nodePort: 30080
  websecure:
    exposedPort: ${HTTPS_PORT}
    nodePort: 30443
    # SSE and AG-UI responses stream for as long as a run takes (8.6).
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 300s

log:
  level: INFO

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
