# D240: a local SMTP sink for the platform's email notifications, kind only. Settings →
# Email points at `mailpit.hiwar-app.svc.cluster.local:1025` with security None; what was
# sent is read at http://localhost:8025 after
#   kubectl -n hiwar-app port-forward svc/mailpit 8025:8025
# Nothing leaves the cluster: Mailpit keeps every message and delivers none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: hiwar-app
  labels: { app.kubernetes.io/name: mailpit }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1
          args: ["--database", "/tmp/mailpit.db"]
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: smtp }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: hiwar-app
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
