# The local cluster of stack specification 8.2: one control plane that publishes the
# gateway's NodePorts on the host, one worker for the application pools and one for
# sandboxes, with Cilium instead of the default CNI so NetworkPolicy is enforced.
#
# A template: `scripts/render-infra.sh` fills in HTTP_PORT and HTTPS_PORT, which default
# to 8080 and 8443 because a web server already holds 80 and 443 on the build machine.
# See docs/12-user-and-developer-guides/local-platform.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hiwar
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: ${HTTP_PORT}, protocol: TCP }
      - { containerPort: 30443, hostPort: ${HTTPS_PORT}, protocol: TCP }
  - role: worker
    labels: { hiwar/pool: app }
  - role: worker
    labels: { hiwar/pool: sandbox }
kubeadmConfigPatches:
  # Docker Desktop's WSL2 virtual machine runs cgroup v1, and a kubelet of this version
  # refuses to start on one unless it is told to. Harmless on a cgroup v2 host.
  - |
    kind: KubeletConfiguration
    failCgroupV1: false
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
