# cert-manager with a self-signed root, which issues the *.hiwar.localtest.me certificates
# the gateway serves locally. Test and Live replace this with the organisation CA or ACME.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: hiwar-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hiwar-local-ca
  namespace: hiwar-system
spec:
  isCA: true
  commonName: AWP local CA
  secretName: hiwar-local-ca
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: hiwar-selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: hiwar-local
spec:
  ca:
    secretName: hiwar-local-ca
