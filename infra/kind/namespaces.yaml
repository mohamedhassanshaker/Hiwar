# The five namespaces of stack specification 8.3.
apiVersion: v1
kind: Namespace
metadata:
  name: awp-system
  labels: { awp/namespace: system, pod-security.kubernetes.io/enforce: privileged }
---
apiVersion: v1
kind: Namespace
metadata:
  name: awp-data
  labels: { awp/namespace: data, pod-security.kubernetes.io/enforce: baseline }
---
apiVersion: v1
kind: Namespace
metadata:
  name: awp-ai
  labels: { awp/namespace: ai, pod-security.kubernetes.io/enforce: baseline }
---
apiVersion: v1
kind: Namespace
metadata:
  name: awp-app
  labels: { awp/namespace: app, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: awp-sandbox
  labels: { awp/namespace: sandbox, pod-security.kubernetes.io/enforce: restricted }
