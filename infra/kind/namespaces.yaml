# The five namespaces of stack specification 8.3.
apiVersion: v1
kind: Namespace
metadata:
  name: hiwar-system
  labels: { hiwar/namespace: system, pod-security.kubernetes.io/enforce: privileged }
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiwar-data
  labels: { hiwar/namespace: data, pod-security.kubernetes.io/enforce: baseline }
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiwar-ai
  labels: { hiwar/namespace: ai, pod-security.kubernetes.io/enforce: baseline }
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiwar-app
  labels: { hiwar/namespace: app, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiwar-sandbox
  labels: { hiwar/namespace: sandbox, pod-security.kubernetes.io/enforce: restricted }
