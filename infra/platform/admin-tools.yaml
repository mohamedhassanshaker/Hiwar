# Local development aid, not part of the platform's own delivery: a web console for the two
# data-tier stores that do not ship one of their own. MinIO and Neo4j already carry a console
# (`minio-console`, `neo4j`'s own browser on 7474); PostgreSQL and Valkey do not.
#
# Published at `adminer.` and `redisinsight.hiwar.localtest.me` behind the admin IP allowlist
# (`infra/gateway/httproutes.yaml`, D225), or reached by port-forward (`docs/12-user-and-developer-guides/local-platform.md`).
# `data-ingress` in `infra/policies/network-policies.yaml` already admits Traefik and any pod
# in `hiwar-data`, so nothing here needs a network policy of its own. Adminer asks for the
# database login; RedisInsight has none and Valkey no password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: hiwar-data
  labels: { app.kubernetes.io/name: adminer }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: adminer } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: adminer }
    spec:
      containers:
        - name: adminer
          image: adminer:latest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # Pre-fills the login form; the password is still typed in by hand.
            - { name: ADMINER_DEFAULT_SERVER, value: "hiwar-pg-rw.hiwar-data.svc.cluster.local" }
          securityContext:
            # The image's own Dockerfile already runs as this user (`adminer`, uid 100); a
            # named rather than numeric USER is what makes `runAsNonRoot` unverifiable without
            # this, not a sign the image needs root.
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: adminer, namespace: hiwar-data }
spec:
  selector: { app.kubernetes.io/name: adminer }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: hiwar-data
  labels: { app.kubernetes.io/name: redisinsight }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redisinsight } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redisinsight }
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports: [{ name: http, containerPort: 5540 }]
          securityContext:
            # The image's own Dockerfile already runs as this user (`node`, uid 1000); see
            # the same note on the Adminer container above.
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        # The database connection you add in the UI, so it survives a pod restart; not a
        # backup of anything Valkey itself holds.
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: redisinsight, namespace: hiwar-data }
spec:
  selector: { app.kubernetes.io/name: redisinsight }
  ports: [{ name: http, port: 5540, targetPort: http }]
