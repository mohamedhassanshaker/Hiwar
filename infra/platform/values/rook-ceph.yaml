# The Rook operator. Stack specification 7.3.
#
# Not installed locally on Windows or macOS: a kind node there has no raw block device for
# an OSD, so `NO_ROOK=1` leaves this release out. It has therefore not been exercised on
# this machine; see docs/12-user-and-developer-guides/local-platform.md.
csi:
  enableRbdDriver: true
  enableCephfsDriver: false
monitoring:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
