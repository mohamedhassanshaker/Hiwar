# Stack specification 6.1. The controller reconciles the `agentgateway` GatewayClass; the
# internal Gateway it serves, and the LLM, MCP and A2A routes on it, are in infra/gateway/
# and are rewritten from Models & routes, Connectors and Integrations at run time.
#
# Only Traefik's Gateway is exposed outside the cluster (8.6), so nothing here is published.
controller:
  replicaCount: 1
  logLevel: info
  service:
    type: ClusterIP

# The AgentgatewayModel API is what a route (alias) from Models & routes becomes.
agentgatewayModels:
  enabled: true

# Routes and backends live in the two namespaces that own them: awp-ai for the model and
# connector routes, awp-app for the platform MCP server the web application exposes.
discoveryNamespaceSelectors:
  - matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [awp-ai, awp-app]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
