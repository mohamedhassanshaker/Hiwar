# Community edition, GPLv3 — recorded in versions.lock.md for sign-off before Test.
neo4j:
  name: hiwar-graph
  edition: community
  resources:
    cpu: "1"
    memory: 2Gi
  passwordFromSecret: neo4j-auth
volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 10Gi
services:
  neo4j:
    enabled: false
