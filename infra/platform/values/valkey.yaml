# Bitnami moved its freely published images to `bitnamilegacy`, so the repository the chart
# defaults to no longer resolves. The tag is the one this chart version pins, from the
# registry that still serves it; `versions.lock.md` records the digest and the licence.
global:
  security:
    allowInsecureImages: true
image:
  repository: bitnamilegacy/valkey
  tag: 8.1.3-debian-12-r2
# The platform's own policies in `infra/policies/` are the only ones that govern hiwar-data.
networkPolicy:
  enabled: false
architecture: standalone
auth:
  enabled: false
master:
  persistence:
    size: 4Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
