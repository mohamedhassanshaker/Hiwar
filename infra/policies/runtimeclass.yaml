# Stack specification 8.6 and the job's scope: gVisor is declared for Test and Live, where
# the nodes carry the runsc shim. kind runs plain runc, so nothing here selects it locally.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    awp/runtime: gvisor
