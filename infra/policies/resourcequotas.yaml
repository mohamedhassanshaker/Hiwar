# A sandbox namespace that cannot starve the cluster, and limits every pod inherits.
apiVersion: v1
kind: ResourceQuota
metadata: { name: sandbox, namespace: awp-sandbox }
spec:
  hard:
    pods: "40"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata: { name: sandbox-defaults, namespace: awp-sandbox }
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: app, namespace: awp-app }
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
