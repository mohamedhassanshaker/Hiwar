# The local hostnames of stack specification 8.2. The console is HTTPS only.
#
# The admin hosts carry the IP-allowlist middleware of 8.6 and keep their own login:
# Temporal UI's OIDC, Phoenix's authentication, the Ceph dashboard's users.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: hiwar-app
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["hiwar.localtest.me"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef:
            { group: traefik.io, kind: Middleware, name: security-headers }
      backendRefs: [{ name: web, port: 3000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
  namespace: hiwar-ai
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["temporal.hiwar.localtest.me"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: temporal-web, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phoenix
  namespace: hiwar-ai
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["phoenix.hiwar.localtest.me"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: phoenix, port: 6006 }]
---
# The AI gateway, published for operators so the gateway can be inspected without a
# port-forward. Behind the admin allowlist like every other admin host: this is the path
# every LLM call takes, so it is not something to leave open.
#
# It fronts the `ai-gateway` data plane, not the `agentgateway` controller - the controller
# serves XDS, health and metrics, none of which is the traffic anyone wants to look at.
#
# Two backends, because the data plane serves two different things on two ports. The `llm`
# listener on 8080 speaks the OpenAI wire protocol and answers `/v1/*` only; everything
# else there is `404 route not found`, which is why `/` has to go elsewhere. The admin
# interface on 15000 serves the UI at `/ui` and the debug endpoints behind it.
#
# `/quitquitquit` shuts the proxy down and the pprof endpoints are a profiling handle, both
# unauthenticated. Neither is published: the rule that matches them first redirects to the
# UI, so reaching them still needs the port-forward in `docs/12-user-and-developer-guides/local-platform.md`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway
  namespace: hiwar-ai
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["aigateway.hiwar.localtest.me"]
  rules:
    - matches:
        - { path: { type: Exact, value: /quitquitquit } }
        - { path: { type: PathPrefix, value: /debug/pprof } }
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path: { type: ReplaceFullPath, replaceFullPath: /ui }
    - matches: [{ path: { type: Exact, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path: { type: ReplaceFullPath, replaceFullPath: /ui }
    - matches: [{ path: { type: PathPrefix, value: /v1 } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: ai-gateway, port: 8080 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: ai-gateway-admin, port: 15000 }]
---
# The data-tier consoles of `infra/platform/admin-tools.yaml` and Neo4j's own browser (D225).
# Adminer asks for the PostgreSQL credentials and Neo4j for its own; RedisInsight has no
# login and Valkey no password, so the allowlist is the only check in front of Valkey.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adminer
  namespace: hiwar-data
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["adminer.hiwar.localtest.me"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: adminer, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redisinsight
  namespace: hiwar-data
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["redisinsight.hiwar.localtest.me"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: redisinsight, port: 5540 }]
---
# Neo4j Browser (`full` profile). The page talks Bolt over a WebSocket to the same host, so
# an upgrade request goes to the Bolt port; connect with `bolt+s://neo4j.hiwar.localtest.me:8443`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neo4j
  namespace: hiwar-data
spec:
  parentRefs: [{ name: hiwar, namespace: hiwar-system, sectionName: websecure }]
  hostnames: ["neo4j.hiwar.localtest.me"]
  rules:
    - matches: [{ headers: [{ name: Upgrade, value: websocket }] }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: neo4j, port: 7687 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: admin-allowlist }
      backendRefs: [{ name: neo4j, port: 7474 }]
