# Stack specification 8.6: Traefik's Gateway is the only one exposed outside the cluster,
# and agentgateway's is internal.
#
# Traefik's `hiwar` Gateway and its GatewayClass come from the Traefik chart
# (`infra/kind/traefik-values.yaml`), which creates the class only alongside its own
# gateway. What belongs here is the certificate that gateway's HTTPS listener names, and
# the internal gateway the AI traffic uses.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hiwar-wildcard
  namespace: hiwar-system
spec:
  secretName: hiwar-wildcard-tls
  dnsNames:
    - hiwar.localtest.me
    - temporal.hiwar.localtest.me
    - phoenix.hiwar.localtest.me
    - aigateway.hiwar.localtest.me
    - s3.hiwar.localtest.me
    - ceph.hiwar.localtest.me
    - minio.hiwar.localtest.me
    - neo4j.hiwar.localtest.me
    - adminer.hiwar.localtest.me
    - redisinsight.hiwar.localtest.me
  issuerRef: { name: hiwar-local, kind: ClusterIssuer, group: cert-manager.io }
---
# The data plane's admin interface binds to loopback by default, so the UI it serves at
# `/ui` is reachable only from inside the proxy container. `adminAddr` is not one of the
# CRD's typed fields, so it goes through `rawConfig`, which the controller merges into the
# generated config file; runtime settings belong under its `config` key.
#
# This is what makes `aigateway.hiwar.localtest.me` serve something. The interface also
# carries `/quitquitquit` and the pprof endpoints, which the HTTPRoute does not publish.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-gateway
  namespace: hiwar-ai
spec:
  rawConfig:
    config:
      adminAddr: 0.0.0.0:15000
---
# The AI gateway (stack specification 6.1 and 8.6). Every model, MCP and A2A call goes
# through it. Its own Gateway is internal: in-cluster traffic reaches it directly on these
# listeners, and nothing outside the cluster reaches them. What is published for operators
# is the data plane's admin interface at `aigateway.hiwar.localtest.me`, behind the admin
# allowlist, so the agentgateway UI can be opened without a port-forward (`httproutes.yaml`).
# The routes on it are written by the web application from Models & routes, Connectors and
# Integrations.
# Named `ai-gateway`, not `agentgateway`: the controller names the data plane it creates
# after the Gateway, and `agentgateway` is already the controller's own Service here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: hiwar-ai
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef: { group: agentgateway.dev, kind: AgentgatewayParameters, name: ai-gateway }
  listeners:
    - name: llm
      protocol: HTTP
      port: 8080
      allowedRoutes:
        # A model route is an AgentgatewayModel, not an HTTPRoute, and a listener accepts
        # only the kinds it names. Without this the controller refuses every route the
        # console renders with "NotAllowedByListeners".
        kinds:
          - { group: agentgateway.dev, kind: AgentgatewayModel }
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hiwar-ai, hiwar-app]
    - name: mcp
      protocol: HTTP
      port: 8081
      allowedRoutes:
        kinds:
          - { group: gateway.networking.k8s.io, kind: HTTPRoute }
          - { group: agentgateway.dev, kind: AgentgatewayBackend }
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hiwar-ai, hiwar-app]
---
# The controller publishes one Service port per listener and nothing else, so the admin
# port needs its own Service for the HTTPRoute to name. The selector is the controller's
# own data plane selector; keying on the Gateway API class label as well as the name keeps
# it off the controller's pods, which do not serve this port.
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-admin
  namespace: hiwar-ai
spec:
  type: ClusterIP
  selector:
    gateway.networking.k8s.io/gateway-name: ai-gateway
    gateway.networking.k8s.io/gateway-class-name: agentgateway
  ports:
    - { name: admin, protocol: TCP, port: 15000, targetPort: 15000 }
