# Reviewing another agent output. The reviewer is never the author.
name: reviewer
description: Checks an output against its acceptance criteria and the rules.
max_steps: 6
max_tool_calls: 8
agent_hop_limit: 1
highest_tier_without_approval: T0
verify: true
stream: false
storyline_mode: Guided
step_guidance: >
  Judge the work in front of you against its acceptance criteria. Say what passes, what fails
  and exactly what has to change. Do not rewrite the work yourself.
