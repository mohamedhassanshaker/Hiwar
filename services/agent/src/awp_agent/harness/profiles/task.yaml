# Work items and request steps assigned to an agent.
name: task
description: Completes one work item or request step end to end.
max_steps: 60
max_tool_calls: 300
agent_hop_limit: 2
highest_tier_without_approval: T1
verify: true
stream: true
storyline_mode: Guided
step_guidance: >
  Work through the plan items in order. Produce the output the acceptance criteria describe,
  and attach every artifact you create. Stop and ask when a decision is not yours to take.
