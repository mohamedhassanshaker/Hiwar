[project]
name = "hiwar-agent"
version = "0.1.0"
description = "Hiwar agent service: one agent turn, knowledge ingestion and retrieval."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.41,<0.42",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pydantic-ai-slim[openai]>=2.55,<3",
    "openai>=3.26,<4",
    "httpx>=0.28,<0.29",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.5,<1",
    "pypdf>=6.1,<7",
    "python-docx>=1.2,<2",
    "beautifulsoup4>=4.13,<5",
    "structlog>=25.4,<26",
]

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiwar_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
