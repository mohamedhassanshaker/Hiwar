# Strict storylines in embedded deployments.
name: scripted
description: Follows a storyline step by step and sends verbatim messages exactly.
max_steps: 20
max_tool_calls: 10
agent_hop_limit: 0
highest_tier_without_approval: T0
verify: false
stream: true
storyline_mode: Strict
step_guidance: >
  Perform only the current storyline step. Send a verbatim message exactly as written, with
  no greeting, apology or addition of your own.
