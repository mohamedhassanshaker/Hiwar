# Scheduled work items.
name: routine
description: Runs a scheduled work item without a person present.
max_steps: 8
max_tool_calls: 20
agent_hop_limit: 1
highest_tier_without_approval: T0
verify: true
stream: false
storyline_mode: Guided
step_guidance: >
  Nobody is watching this run. Never ask a question you can answer from the data, and leave a
  handoff that explains what you did and what is still open.
