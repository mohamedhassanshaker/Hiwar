[project]
name = "awp-modelstub"
version = "0.1.0"
description = "AWP deterministic local engine: an OpenAI-compatible backend for development and tests."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.41,<0.42",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.12,<3",
    "structlog>=25.4,<26",
]

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    # starlette 1.x asks for httpx2 in its test client; httpx 0.28 is deprecated there.
    "httpx2>=2.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awp_modelstub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "BLE"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["awp_modelstub"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
